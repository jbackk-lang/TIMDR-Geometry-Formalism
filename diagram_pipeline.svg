<svg width="680" height="832" viewBox="0 0 680 832" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Potok algorytmu dyskretnego operatora Weingartena</title>
<desc>Pięć kroków: siatka trójkątna, normalne wierzchołkowe, rzut na styczną, dopasowanie metodą najmniejszych kwadratów, wartości własne dające krzywizny główne — rozgałęziające się na dwa sposoby liczenia skrętu powierzchniowego (T_S empiryczny wprost z Aksjomatu G3, T_S przewidywany z operatora kształtu wg Aksjomatu G9c), które są następnie porównywane.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="340" y1="96" x2="340" y2="148" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="212" x2="340" y2="264" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="328" x2="340" y2="380" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="444" x2="340" y2="496" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="560" x2="210" y2="612" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="560" x2="470" y2="612" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="210" y1="676" x2="340" y2="728" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="470" y1="676" x2="340" y2="728" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="100" y="40" width="480" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Siatka 3D</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">wierzchołki + trójkąty</text>
</g>

<g>
<rect x="100" y="156" width="480" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Normalne n(p)</text>
<text x="340" y="192" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">średnia ważona polem</text>
</g>

<g>
<rect x="100" y="272" width="480" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="290" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Rzut na styczną</text>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Δp, Δn na 1-ringu</text>
</g>

<g>
<rect x="100" y="388" width="480" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="406" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Dopasowanie MNK</text>
<text x="340" y="424" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">symetryzowana macierz 2×2</text>
</g>

<g>
<rect x="100" y="504" width="480" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="522" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Wartości własne</text>
<text x="340" y="540" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">krzywizny główne κ1, κ2</text>
</g>

<g>
<rect x="100" y="620" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="210" y="638" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">T_S empiryczny</text>
<text x="210" y="656" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">‖n(q)−n(p)‖</text>
</g>

<g>
<rect x="360" y="620" width="220" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="470" y="638" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#712B13">T_S przewidywany</text>
<text x="470" y="656" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">‖Δp‖·‖S_p(Δ̂p)‖</text>
</g>

<g>
<rect x="190" y="736" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="754" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Porównanie</text>
<text x="340" y="772" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">zgodność do O(Δp²)</text>
</g>
</svg>
