<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title>Trzy powierzchnie testowe i ich krzywizna</title>
<desc>Płaszczyzna z równoległymi wektorami normalnymi (krzywizna zero), sfera z wektorami normalnymi rozchodzącymi się promieniście we wszystkich kierunkach (krzywizna dodatnia, jednakowa w obu kierunkach głównych), i walec z dwoma przekrojami pokazującymi krzywiznę zero wzdłuż osi i krzywiznę dodatnią w kierunku obwodowym.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="125" y="56" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Płaszczyzna</text>
<rect x="40" y="70" width="170" height="140" rx="4" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
<line x1="60" y1="140" x2="190" y2="140" stroke="#0F6E56" stroke-width="1.2" fill="none"/>
<line x1="70" y1="140" x2="70" y2="116" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="95" y1="140" x2="95" y2="116" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="120" y1="140" x2="120" y2="116" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="145" y1="140" x2="145" y2="116" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="170" y1="140" x2="170" y2="116" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="125" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">κ ≈ 0</text>

<text x="320" y="56" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Sfera</text>
<rect x="235" y="70" width="170" height="140" rx="4" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
<path d="M 248.9 121.3 L 284.1 112.8 L 320 110 L 355.9 112.8 L 391.1 121.3" stroke="#0F6E56" stroke-width="1.2" fill="none"/>
<line x1="248.9" y1="121.3" x2="242.1" y2="100.4" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="284.1" y1="112.8" x2="280.7" y2="91.1" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="320" y1="110" x2="320" y2="88" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="355.9" y1="112.8" x2="359.3" y2="91.1" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="391.1" y1="121.3" x2="397.9" y2="100.4" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="320" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">κ ≈ 1/R</text>

<text x="515" y="56" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Walec</text>
<rect x="430" y="70" width="170" height="140" rx="4" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 3"/>
<circle cx="515" cy="105" r="22" fill="none" stroke="#0F6E56" stroke-width="1.2"/>
<line x1="537" y1="105" x2="549" y2="105" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="526" y1="124.05" x2="532" y2="134.4" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="504" y1="124.05" x2="498" y2="134.4" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="493" y1="105" x2="481" y2="105" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="504" y1="85.95" x2="498" y2="75.6" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="526" y1="85.95" x2="532" y2="75.6" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="475" y1="185" x2="555" y2="185" stroke="#0F6E56" stroke-width="1.2" fill="none"/>
<line x1="485" y1="185" x2="485" y2="167" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="505" y1="185" x2="505" y2="167" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="525" y1="185" x2="525" y2="167" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="545" y1="185" x2="545" y2="167" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="515" y="232" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">κ ≈ 1/r, κ ≈ 0</text>
</svg>
